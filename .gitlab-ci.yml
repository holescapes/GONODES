stages:
  - build

variables:
  SCONS_FLAGS: "target=template_release -j4"

# ── Windows ────────────────────────────────────────────────────────────────────
build:windows:
  stage: build
  tags: [saas-windows-medium-amd64]
  rules:
    - changes:
        - addons/gn_native/src/**/*
        - addons/gn_native/SConstruct
        - .gitlab-ci.yml
      when: always
    - when: manual
  before_script:
    - pip install scons
  script:
    - cd addons/gn_native
    - scons platform=windows $SCONS_FLAGS
  artifacts:
    paths:
      - addons/gn_native/bin/win64/
    expire_in: 90 days

# ── Linux ──────────────────────────────────────────────────────────────────────
build:linux:
  stage: build
  tags: [saas-linux-medium-amd64]
  image: ubuntu:22.04
  rules:
    - changes:
        - addons/gn_native/src/**/*
        - addons/gn_native/SConstruct
        - .gitlab-ci.yml
      when: always
    - when: manual
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 python3-pip g++ pkg-config
    - pip3 install scons
  script:
    - cd addons/gn_native
    - scons platform=linux $SCONS_FLAGS
  artifacts:
    paths:
      - addons/gn_native/bin/linux64/
    expire_in: 90 days

# ── macOS ──────────────────────────────────────────────────────────────────────
build:macos:
  stage: build
  tags: [saas-macos-medium-m1]
  rules:
    - changes:
        - addons/gn_native/src/**/*
        - addons/gn_native/SConstruct
        - .gitlab-ci.yml
      when: always
    - when: manual
  before_script:
    - pip3 install scons
  script:
    - cd addons/gn_native
    - scons platform=macos $SCONS_FLAGS
  artifacts:
    paths:
      - addons/gn_native/bin/macos/
    expire_in: 90 days
