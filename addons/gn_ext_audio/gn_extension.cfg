[extension]

name="Audio Synthesis & Effects"
version="1.0.0"
author="GONODES"
description="Audio synthesis, effects, and processing operators. Waveform generation, biquad filtering, parametric EQ, mixing, reverb, delay, pitch shifting, and more."
section="Audio"
dependencies=[]
platforms=["windows", "macos", "linux"]

[operator.AudioOscillatorCHOP]

family="CHOP"
script="res://addons/gn_ext_audio/operators/chop/audio_oscillator_chop.gd"
description="Audio-rate waveform generator with FM/AM modulation."

[operator.AudioFilterCHOP]

family="CHOP"
script="res://addons/gn_ext_audio/operators/chop/audio_filter_chop.gd"
description="Biquad IIR audio filter (lowpass, highpass, bandpass, notch, allpass, peak, shelf)."

[operator.AudioParaEQCHOP]

family="CHOP"
script="res://addons/gn_ext_audio/operators/chop/audio_para_eq_chop.gd"
description="Multi-band parametric equalizer with configurable frequency, gain, and Q per band."

[operator.AudioMixCHOP]

family="CHOP"
script="res://addons/gn_ext_audio/operators/chop/audio_mix_chop.gd"
description="Multi-input audio mixer with per-input gain, pan, mute, and solo."

[operator.AudioMovieCHOP]

family="CHOP"
script="res://addons/gn_ext_audio/operators/chop/audio_movie_chop.gd"
description="Extract audio track from video file for synchronized playback."

[operator.AudioRenderCHOP]

family="CHOP"
script="res://addons/gn_ext_audio/operators/chop/audio_render_chop.gd"
description="Offline render of CHOP audio chain to buffer (non-realtime bounce)."

[operator.AudioStreamInCHOP]

family="CHOP"
script="res://addons/gn_ext_audio/operators/chop/audio_stream_in_chop.gd"
description="Receive audio over network via UDP/RTP."

[operator.AudioStreamOutCHOP]

family="CHOP"
script="res://addons/gn_ext_audio/operators/chop/audio_stream_out_chop.gd"
description="Send audio over network via UDP/RTP."

[operator.AudioReverbCHOP]

family="CHOP"
script="res://addons/gn_ext_audio/operators/chop/audio_reverb_chop.gd"
description="Algorithmic reverb (Schroeder/FDN) on CHOP audio data."

[operator.AudioDelayCHOP]

family="CHOP"
script="res://addons/gn_ext_audio/operators/chop/audio_delay_chop.gd"
description="Sample-accurate delay line with feedback and ping-pong modes."

[operator.AudioPitchCHOP]

family="CHOP"
script="res://addons/gn_ext_audio/operators/chop/audio_pitch_chop.gd"
description="Pitch shift without tempo change via granular resynthesis."

[operator.AudioEnvelopeCHOP]

family="CHOP"
script="res://addons/gn_ext_audio/operators/chop/audio_envelope_chop.gd"
description="Amplitude envelope follower with configurable attack/release for sidechain and ducking."

[operator.AudioGateCHOP]

family="CHOP"
script="res://addons/gn_ext_audio/operators/chop/audio_gate_chop.gd"
description="Noise gate with threshold, attack, hold, and release."
