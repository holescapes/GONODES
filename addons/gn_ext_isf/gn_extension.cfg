[extension]

name="ISF Shader Pack"
version="1.0.0"
author="GONODES"
description="ISF (Interactive Shader Format) support for GONODES. Single ISFTOP node with inline code editor, ISF syntax highlighting, auto-generated parameters from JSON INPUTS, full multi-pass and persistent buffer support. 10 factory presets (.fs files translated at runtime). Compatible with ISFv2."
dependencies=[]
section="ISF"

[operator.ISFTOP]
family="TOP"
script="res://addons/gn_ext_isf/operators/top/isf_top.gd"
description="ISF shader node — inline code editor with ISF syntax highlighting and presets. Parameters and input ports are auto-generated from the JSON INPUTS header. Supports single-pass and multi-pass (PASSES) including persistent buffers."
