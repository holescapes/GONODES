[extension]

name="LibPd Pure Data Integration"
version="1.0.0"
author="GONODES"
description="Pure Data (Pd) audio synthesis integration via libpd. Run Pd patches as audio generators, effects, and control processors inside GONODES."
section="Audio"
dependencies=[]
platforms=["windows", "macos", "linux"]

[operator.PdSynthCHOP]

family="CHOP"
script="res://addons/gn_ext_libpd/operators/chop/pd_synth_chop.gd"
description="Run a Pure Data patch as an audio synthesizer. Outputs stereo audio from Pd."

[operator.PdFilterCHOP]

family="CHOP"
script="res://addons/gn_ext_libpd/operators/chop/pd_filter_chop.gd"
description="Process audio through a Pure Data patch as an effect/filter."

[operator.PdControlCHOP]

family="CHOP"
script="res://addons/gn_ext_libpd/operators/chop/pd_control_chop.gd"
description="Send/receive control messages to/from a Pure Data patch. Outputs received values as channels."
