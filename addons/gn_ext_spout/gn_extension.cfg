[extension]

name="Spout Texture Sharing"
version="1.0.0"
author="GONODES"
description="Windows Spout2 texture sharing — send and receive GPU textures between applications. Requires Windows with DirectX 11."
section="Spout"

[operator.SpoutInTOP]

family="TOP"
script="res://addons/gn_ext_spout/operators/top/spout_in_top.gd"
description="Receive a shared GPU texture from another Spout sender application."

[operator.SpoutOutTOP]

family="TOP"
script="res://addons/gn_ext_spout/operators/top/spout_out_top.gd"
description="Share the input texture via Spout to other applications."
