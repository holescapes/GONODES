# build.cfg — Spout2 texture sharing (Windows-only)
# Declarative build configuration read by build/gn_build.py

[library]
name = gn_spout
entry_symbol = gn_spout_init
platforms = windows

[sources]
cpp = src/*.cpp
thirdparty_cpp = Spout2/SPOUTSDK/SpoutGL/Spout.cpp, Spout2/SPOUTSDK/SpoutGL/SpoutCopy.cpp, Spout2/SPOUTSDK/SpoutGL/SpoutDirectX.cpp, Spout2/SPOUTSDK/SpoutGL/SpoutFrameCount.cpp, Spout2/SPOUTSDK/SpoutGL/SpoutGL.cpp, Spout2/SPOUTSDK/SpoutGL/SpoutGLextensions.cpp, Spout2/SPOUTSDK/SpoutGL/SpoutReceiver.cpp, Spout2/SPOUTSDK/SpoutGL/SpoutSender.cpp, Spout2/SPOUTSDK/SpoutGL/SpoutSenderNames.cpp, Spout2/SPOUTSDK/SpoutGL/SpoutSharedMemory.cpp, Spout2/SPOUTSDK/SpoutGL/SpoutUtils.cpp
include_dirs = Spout2/SPOUTSDK/SpoutGL

[windows]
libs = opengl32, d3d11, dxgi, user32, Advapi32, gdi32
