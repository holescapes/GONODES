[extension]

name="User Native C++ Operators"
version="1.0.0"
author="GONODES"
description="Hot-reloadable C++ operators for maximum performance. Write single-file C++ nodes, compile in seconds, and hot-reload without restarting. Bundled godot-cpp headers and optional compiler toolchain."
section="User Native"

[operator.UserNativeSOP]

family="SOP"
script="res://addons/gn_ext_user_native/operators/sop/user_native_sop.gd"
description="User-written C++ SOP operator with hot-reload."

[operator.UserNativeCHOP]

family="CHOP"
script="res://addons/gn_ext_user_native/operators/chop/user_native_chop.gd"
description="User-written C++ CHOP operator with hot-reload."

[operator.UserNativeIMG]

family="IMG"
script="res://addons/gn_ext_user_native/operators/img/user_native_img.gd"
description="User-written C++ IMG operator with hot-reload."

[operator.UserNativeTOP]

family="TOP"
script="res://addons/gn_ext_user_native/operators/top/user_native_top.gd"
description="User-written C++ TOP operator with hot-reload."

[operator.UserNativeDAT]

family="DAT"
script="res://addons/gn_ext_user_native/operators/dat/user_native_dat.gd"
description="User-written C++ DAT operator with hot-reload."
