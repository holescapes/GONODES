[extension]
name="Syphon Texture Sharing"
version="1.0.0"
author="GONODES"
description="macOS Syphon texture sharing - send and receive GPU textures between applications via IOSurface. Requires macOS."
section="Syphon"
platforms=["macos"]
dependencies=["GNSyphonServer", "GNSyphonClient"]

[operator.SyphonInTOP]
family="TOP"
script="res://addons/gn_ext_syphon/operators/top/syphon_in_top.gd"
description="Receive a shared GPU texture from another Syphon server application."

[operator.SyphonOutTOP]
family="TOP"
script="res://addons/gn_ext_syphon/operators/top/syphon_out_top.gd"
description="Share the input texture via Syphon to other applications."
