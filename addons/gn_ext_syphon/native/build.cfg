# build.cfg — Syphon texture sharing (macOS-only)
# Declarative build configuration read by build/gn_build.py

[library]
name = gn_syphon
entry_symbol = gn_syphon_init
platforms = macos

[sources]
cpp = src/*.cpp
objcxx = src/*.mm
include_dirs = Syphon-Framework

[macos]
frameworks = Cocoa, OpenGL, IOSurface, CoreVideo, Metal, Syphon
