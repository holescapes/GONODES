[extension]
name="NDI Video/Audio Over IP"
version="1.0.0"
author="GONODES"
description="NDI (Network Device Interface) video and audio streaming over IP. Receive and send video + audio to/from any NDI-compatible device or software on the network."
dependencies=["GNNDIReceiver", "GNNDISender"]
runtime_dlls={"windows": ["Processing.NDI.Lib.x64.dll"], "linux": ["libndi.so"], "macos": ["libndi.dylib"]}
section="NDI"
platforms=["windows", "linux", "macos"]

[operator.NDIInTOP]
family="TOP"
script="res://addons/gn_ext_ndi/operators/top/ndi_in_top.gd"
description="Receive NDI video stream as a texture. Auto-discovers sources on the local network."

[operator.NDIOutTOP]
family="TOP"
script="res://addons/gn_ext_ndi/operators/top/ndi_out_top.gd"
description="Send TOP texture as an NDI source visible to other applications and devices."

[operator.NDIAudioInCHOP]
family="CHOP"
script="res://addons/gn_ext_ndi/operators/chop/ndi_audio_in_chop.gd"
description="Receive NDI audio channels as CHOP data. Supports multi-channel float audio."

[operator.NDIAudioOutCHOP]
family="CHOP"
script="res://addons/gn_ext_ndi/operators/chop/ndi_audio_out_chop.gd"
description="Send CHOP audio channels as an NDI audio source."
