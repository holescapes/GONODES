[library]
name = gn_ndi
entry_symbol = gn_ndi_init
platforms = windows, linux, macos

[sources]
cpp = src/*.cpp
include_dirs = src, ndi_sdk/Include

[windows]
lib_dirs = ndi_sdk/Lib/x64
libs = Processing.NDI.Lib.x64

[linux]
lib_dirs = ndi_sdk/lib/x86_64-linux
libs = ndi

[macos]
lib_dirs = ndi_sdk/lib
libs = ndi
frameworks = Foundation
