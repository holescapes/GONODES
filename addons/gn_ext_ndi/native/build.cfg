[library]
name = gn_ndi
entry_symbol = gn_ndi_init
platforms = windows, linux, macos
tier = optional
optional = true
default = false

[sources]
cpp = src/*.cpp
include_dirs = src, ndi_sdk/Include

[windows]
probe = ndi_sdk/Include/Processing.NDI.Lib.h
lib_dirs = ndi_sdk/Lib/x64
libs = Processing.NDI.Lib.x64

[linux]
probe = ndi_sdk/lib/x86_64-linux/libndi.so
lib_dirs = ndi_sdk/lib/x86_64-linux
libs = ndi

[macos]
probe = ndi_sdk/lib/libndi.dylib
lib_dirs = ndi_sdk/lib
libs = ndi
frameworks = Foundation
