# build.cfg — Cross-platform MIDI I/O via RtMidi
# Declarative build configuration read by build/gn_build.py

[library]
name = gn_midi
entry_symbol = gn_midi_init
platforms = windows, macos, linux
tier = core
default = true

[sources]
cpp = src/*.cpp
thirdparty_cpp = rtmidi/RtMidi.cpp
include_dirs = rtmidi

[windows]
libs = winmm
defines = __WINDOWS_MM__

[macos]
frameworks = CoreMIDI, CoreAudio, CoreFoundation
defines = __MACOSX_CORE__

[linux]
libs = asound, pthread
defines = __LINUX_ALSA__
