[extension]
name="MIDI I/O"
version="1.0.0"
author="GONODES"
description="Cross-platform MIDI input and output via RtMidi. Receive and send MIDI messages - notes, CC, program changes, etc."
section="MIDI"
dependencies=["GNMidiIn", "GNMidiOut"]
platforms=["windows", "macos", "linux"]

[operator.RtMidiInCHOP]
family="CHOP"
script="res://addons/gn_ext_midi/operators/chop/midi_in_chop.gd"
description="Receive MIDI via RtMidi native library (lower latency than built-in)."

[operator.RtMidiOutCHOP]
family="CHOP"
script="res://addons/gn_ext_midi/operators/chop/midi_out_chop.gd"
description="Send MIDI via RtMidi native library."
