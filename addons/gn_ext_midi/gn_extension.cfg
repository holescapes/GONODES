[extension]

name="MIDI I/O"
version="1.0.0"
author="GONODES"
description="Cross-platform MIDI input and output via RtMidi. Receive and send MIDI messages — notes, CC, program changes, etc."
section="MIDI"

[operator.MidiInCHOP]

family="CHOP"
script="res://addons/gn_ext_midi/operators/chop/midi_in_chop.gd"
description="Receive MIDI messages from an external controller or DAW."

[operator.MidiOutCHOP]

family="CHOP"
script="res://addons/gn_ext_midi/operators/chop/midi_out_chop.gd"
description="Send MIDI messages to an external device or DAW."
