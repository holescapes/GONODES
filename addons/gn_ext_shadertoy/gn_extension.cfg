[extension]

name="Shadertoy Shader Pack"
version="1.1.0"
author="GONODES"
description="ShadertoyURLTOP — paste raw Shadertoy mainImage GLSL or fetch by URL. All translation is done at runtime through the Shadertoy-to-Godot pipeline. 10 factory presets included; user presets saved to user://gonodes_presets/shadertoy/."
dependencies=[]
section="Shadertoy"

[operator.ShadertoyURLTOP]
family="TOP"
script="res://addons/gn_ext_shadertoy/operators/top/shadertoy_url_top.gd"
description="Paste raw Shadertoy GLSL (void mainImage) or fetch by URL — auto-translated and compiled at runtime. Parameters auto-generated from uniform declarations."

; Generators (no input)

[operator.STSeascapeTOP]
family="TOP"
script="res://addons/gn_ext_shadertoy/operators/top/st_seascape_top.gd"
description="Procedural ocean with waves and lighting. Shadertoy conversion of 'Seascape' by TDM."

[operator.STVoronoiFireTOP]
family="TOP"
script="res://addons/gn_ext_shadertoy/operators/top/st_voronoi_fire_top.gd"
description="Volumetric fire palette over 3D Voronoi noise. Shadertoy conversion of 'Combustible Voronoi Layers' by Shane."

[operator.STCreationTOP]
family="TOP"
script="res://addons/gn_ext_shadertoy/operators/top/st_creation_top.gd"
description="Compact demoscene colour field. Shadertoy conversion of 'Creation' by Silexars."

[operator.STStarNestTOP]
family="TOP"
script="res://addons/gn_ext_shadertoy/operators/top/st_star_nest_top.gd"
description="Volumetric space fractal animation. Shadertoy conversion of 'Star Nest' by Kali."

[operator.STPlasmaTOP]
family="TOP"
script="res://addons/gn_ext_shadertoy/operators/top/st_plasma_top.gd"
description="Classic retro plasma globe effect. Original GONODES shader."

; Effects (one input)

[operator.STCRTTOP]
family="TOP"
script="res://addons/gn_ext_shadertoy/operators/top/st_crt_top.gd"
description="CRT barrel distortion with scanlines and vignette. Original GONODES shader."

[operator.STChromaticAbTOP]
family="TOP"
script="res://addons/gn_ext_shadertoy/operators/top/st_chromatic_ab_top.gd"
description="Radial RGB channel offset (chromatic aberration). Original GONODES shader."

[operator.STPixelateTOP]
family="TOP"
script="res://addons/gn_ext_shadertoy/operators/top/st_pixelate_top.gd"
description="Mosaic / pixelation post-processing. Original GONODES shader."

[operator.STFilmGrainTOP]
family="TOP"
script="res://addons/gn_ext_shadertoy/operators/top/st_film_grain_top.gd"
description="Animated noise grain overlay. Original GONODES shader."

[operator.STHalftoneTOP]
family="TOP"
script="res://addons/gn_ext_shadertoy/operators/top/st_halftone_top.gd"
description="CMYK halftone dot rendering. Shadertoy conversion of 'CMYK Halftone' by tsone."

; Runtime translator

[operator.ShadertoyURLTOP]
family="TOP"
script="res://addons/gn_ext_shadertoy/operators/top/shadertoy_url_top.gd"
description="Paste Shadertoy GLSL or fetch by URL -- auto-translates and compiles at runtime."