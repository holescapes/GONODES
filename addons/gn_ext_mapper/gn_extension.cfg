[extension]
name="Projection Mapper"
version="1.0.0"
author="GONODES"
description="Projection mapping toolkit - quad warp, bezier mesh, grid warp, edge blending, and masking for multi-projector setups. Inspired by Kantan Mapper."
section="Mapper"
dependencies=[]

[operator.QuadMapTOP]
family="TOP"
script="res://addons/gn_ext_mapper/operators/top/quad_map_top.gd"
description="4-corner pin warp for mapping a texture onto a rectangular surface."

[operator.BezierMapTOP]
family="TOP"
script="res://addons/gn_ext_mapper/operators/top/bezier_map_top.gd"
description="Bezier mesh warp for mapping textures onto curved surfaces."

[operator.GridWarpTOP]
family="TOP"
script="res://addons/gn_ext_mapper/operators/top/grid_warp_top.gd"
description="Grid-based mesh warp with adjustable control points."

[operator.EdgeBlendTOP]
family="TOP"
script="res://addons/gn_ext_mapper/operators/top/edge_blend_top.gd"
description="Soft-edge gradient blending for overlapping projector regions."

[operator.ProjectionMaskTOP]
family="TOP"
script="res://addons/gn_ext_mapper/operators/top/projection_mask_top.gd"
description="Projection mask with adjustable polygon or rectangle cutout regions."

[operator.StonerTOP]
family="TOP"
script="res://addons/gn_ext_mapper/operators/top/stoner_top.gd"
description="Keystone correction with softedge blending and test patterns for projection surfaces."

[operator.ProjectorBlendTOP]
family="TOP"
script="res://addons/gn_ext_mapper/operators/top/projector_blend_top.gd"
description="Multi-projector luminance blending with overlap correction and color matching."

[operator.CornerDragUI]
family="UI"
script="res://addons/gn_ext_mapper/operators/ui/corner_drag_ui.gd"
description="4-corner drag pad - outputs corner positions as CHOP channels for QuadMapTOP/StonerTOP."

[operator.BezierDragUI]
family="UI"
script="res://addons/gn_ext_mapper/operators/ui/bezier_drag_ui.gd"
description="4x4 Bezier control point grid - outputs positions as CHOP channels for BezierMapTOP."

[operator.GridDragUI]
family="UI"
script="res://addons/gn_ext_mapper/operators/ui/grid_drag_ui.gd"
description="NxM grid drag pad - outputs per-point offsets as CHOP channels for GridWarpTOP."
