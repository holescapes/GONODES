[extension]

name="Web Render (CEF)"
version="1.0.0"
author="GONODES"
description="Render web pages (HTML/CSS/JS/WebGL) to texture via Chromium Embedded Framework. Requires gdCEF (Lecrapouille/gdcef) — place cef_artifacts/ in addons/gn_ext_webrender/."
dependencies=["GDCEF", "GdBrowserView"]
boot_script="res://addons/gn_ext_webrender/boot.gd"
section="Web"
platforms=["windows", "linux"]

[operator.WebRenderTOP]

family="TOP"
script="res://addons/gn_ext_webrender/operators/top/web_render_top.gd"
description="Render a web page (URL or inline HTML/CSS/JS) to a texture via Chromium CEF."
