[extension]

name="SDF"
version="1.0.0"
author="GONODES"
description="Signed Distance Field operators — primitives, booleans, modifiers, materials, and a raymarcher."
section="SDF"
boot_script="res://addons/gn_ext_sdf/boot.gd"

[family.SDF]

color="0.95,0.65,0.15"
data_script="res://addons/gn_ext_sdf/core/gn_sdf_data.gd"

# ── SDF Primitives ──────────────────────────────────────────────

[operator.SphereSDF]

family="SDF"
script="res://addons/gn_ext_sdf/operators/sdf/sphere_sdf.gd"
description="SDF sphere primitive. Outputs an SDF tree node with position and radius."

[operator.BoxSDF]

family="SDF"
script="res://addons/gn_ext_sdf/operators/sdf/box_sdf.gd"
description="SDF box primitive. Outputs an SDF tree node with position and size (half-extents)."

[operator.TorusSDF]

family="SDF"
script="res://addons/gn_ext_sdf/operators/sdf/torus_sdf.gd"
description="SDF torus primitive. Outputs an SDF tree node with position, major and minor radii."

[operator.CylinderSDF]

family="SDF"
script="res://addons/gn_ext_sdf/operators/sdf/cylinder_sdf.gd"
description="SDF cylinder primitive. Outputs an SDF tree node with position, radius, and height."

[operator.CapsuleSDF]

family="SDF"
script="res://addons/gn_ext_sdf/operators/sdf/capsule_sdf.gd"
description="SDF capsule primitive. Outputs an SDF tree node with position, radius, and height."

[operator.PlaneSDF]

family="SDF"
script="res://addons/gn_ext_sdf/operators/sdf/plane_sdf.gd"
description="SDF infinite plane primitive. Outputs an SDF tree node with normal direction and offset."

[operator.ConeSDF]

family="SDF"
script="res://addons/gn_ext_sdf/operators/sdf/cone_sdf.gd"
description="SDF cone primitive. Outputs an SDF tree node with position, angle, and height."

[operator.PyramidSDF]

family="SDF"
script="res://addons/gn_ext_sdf/operators/sdf/pyramid_sdf.gd"
description="SDF pyramid primitive. Outputs an SDF tree node with position, base size, and height."

[operator.OctahedronSDF]

family="SDF"
script="res://addons/gn_ext_sdf/operators/sdf/octahedron_sdf.gd"
description="SDF octahedron primitive. Outputs an SDF tree node with position and size."

[operator.GyroidSDF]

family="SDF"
script="res://addons/gn_ext_sdf/operators/sdf/gyroid_sdf.gd"
description="SDF gyroid (triply periodic minimal surface) primitive. Outputs an SDF tree node with position, scale, and thickness."

# ── SDF Boolean Operations ──────────────────────────────────────

[operator.UnionSDF]

family="SDF"
script="res://addons/gn_ext_sdf/operators/sdf/union_sdf.gd"
description="SDF boolean union — combines two SDF inputs, keeping the closest surface (min)."

[operator.IntersectionSDF]

family="SDF"
script="res://addons/gn_ext_sdf/operators/sdf/intersection_sdf.gd"
description="SDF boolean intersection — keeps only the overlapping volume of two SDF inputs (max)."

[operator.SubtractSDF]

family="SDF"
script="res://addons/gn_ext_sdf/operators/sdf/subtract_sdf.gd"
description="SDF boolean subtraction — carves input B from input A."

[operator.SmoothUnionSDF]

family="SDF"
script="res://addons/gn_ext_sdf/operators/sdf/smooth_union_sdf.gd"
description="SDF smooth boolean union — blends two SDF inputs with adjustable smoothness."

[operator.SmoothSubtractSDF]

family="SDF"
script="res://addons/gn_ext_sdf/operators/sdf/smooth_subtract_sdf.gd"
description="SDF smooth boolean subtraction — carves B from A with a smooth blend radius."

# ── SDF Domain Modifiers ────────────────────────────────────────

[operator.RepeatSDF]

family="SDF"
script="res://addons/gn_ext_sdf/operators/sdf/repeat_sdf.gd"
description="SDF domain repetition — repeats the child SDF along each axis with configurable spacing and optional limit."

[operator.MirrorSDF]

family="SDF"
script="res://addons/gn_ext_sdf/operators/sdf/mirror_sdf.gd"
description="SDF domain mirror — mirrors the child SDF across selected axes using abs()."

[operator.TwistSDF]

family="SDF"
script="res://addons/gn_ext_sdf/operators/sdf/twist_sdf.gd"
description="SDF domain twist — twists the child SDF around a selected axis."

[operator.BendSDF]

family="SDF"
script="res://addons/gn_ext_sdf/operators/sdf/bend_sdf.gd"
description="SDF domain bend — bends the child SDF around a selected axis."

[operator.ElongateSDF]

family="SDF"
script="res://addons/gn_ext_sdf/operators/sdf/elongate_sdf.gd"
description="SDF domain elongation — stretches the child SDF along each axis."

[operator.RoundSDF]

family="SDF"
script="res://addons/gn_ext_sdf/operators/sdf/round_sdf.gd"
description="SDF rounding — rounds the edges of the child SDF by subtracting a radius."

[operator.OnionSDF]

family="SDF"
script="res://addons/gn_ext_sdf/operators/sdf/onion_sdf.gd"
description="SDF onion skinning — hollows the child SDF with configurable thickness and layers."

[operator.DisplaceSDF]

family="SDF"
script="res://addons/gn_ext_sdf/operators/sdf/displace_sdf.gd"
description="SDF sine displacement — adds procedural sine-based surface detail to the child SDF."

# ── SDF Materials ───────────────────────────────────────────────

[operator.MaterialSDF]

family="SDF"
script="res://addons/gn_ext_sdf/operators/sdf/material_sdf.gd"
description="SDF material assignment — attaches albedo, roughness, metallic, and emission to a child SDF tree."

[operator.GradientSDF]

family="SDF"
script="res://addons/gn_ext_sdf/operators/sdf/gradient_sdf.gd"
description="SDF gradient material — maps distance to a near/far color gradient on the child SDF."

# ── SDF Utility ─────────────────────────────────────────────────

[operator.SelectSDF]

family="SDF"
script="res://addons/gn_ext_sdf/operators/sdf/select_sdf.gd"
description="Reference a remote SDF by name — wireless SDF tree routing."

# ── SDF Renderer ────────────────────────────────────────────────

[operator.RaymarchSDF]

family="SDF"
script="res://addons/gn_ext_sdf/operators/sdf/raymarch_sdf.gd"
description="SDF raymarcher — compiles the SDF tree into a GLSL shader and renders it to a texture with orbit camera, AO, and soft shadows."
