[extension]
name="PixelMapper"
version="1.0.0"
author="GONODES"
description="LED pixel mapping - define fixture layouts, sample image pixels at LED positions, and route values to DMX."
section="FIX"
boot_script="res://addons/gn_ext_pixel_mapper/boot.gd"

[family.FIX]
color="0.15,0.85,0.65"
data_script="res://addons/gn_ext_pixel_mapper/core/gn_fixture_data.gd"


[operator.StripFIX]
family="FIX"
script="res://addons/gn_ext_pixel_mapper/operators/fix/strip_fix.gd"
description="Linear LED strip fixture. Defines N LEDs laid out in a line between two UV endpoints."

[operator.GridFIX]
family="FIX"
script="res://addons/gn_ext_pixel_mapper/operators/fix/grid_fix.gd"
description="2D LED grid fixture. Defines a rectangular grid of LEDs within a UV bounding box."

[operator.MatrixFIX]
family="FIX"
script="res://addons/gn_ext_pixel_mapper/operators/fix/matrix_fix.gd"
description="LED matrix fixture with configurable pixel pitch, rotation, and skew. For stage LED walls and irregular panels."

[operator.CustomFIX]
family="FIX"
script="res://addons/gn_ext_pixel_mapper/operators/fix/custom_fix.gd"
description="Custom LED positions loaded from a DAT input. Each row provides a UV coordinate (uv_x, uv_y) for one LED."

[operator.FileInFIX]
family="FIX"
script="res://addons/gn_ext_pixel_mapper/operators/fix/file_in_fix.gd"
description="Loads a fixture definition from a JSON file. Supports GONODES .fixture format and basic MadMapper export."


[operator.SelectFIX]
family="FIX"
script="res://addons/gn_ext_pixel_mapper/operators/fix/select_fix.gd"
description="Wireless fixture reference. Re-emits a named FIX node's output without a wire."

[operator.NullFIX]
family="FIX"
script="res://addons/gn_ext_pixel_mapper/operators/fix/null_fix.gd"
description="FIX pass-through. Forwards its input fixture unchanged. Useful as a labelled relay point."

[operator.SwitchFIX]
family="FIX"
script="res://addons/gn_ext_pixel_mapper/operators/fix/switch_fix.gd"
description="Selects one of up to N FIX inputs to pass through, based on an index parameter or expression."


[operator.FixtureSamplerTOP]
family="TOP"
script="res://addons/gn_ext_pixel_mapper/operators/top/fixture_sampler_top.gd"
description="Samples a source image at every LED position across all connected fixtures. Outputs a packed texture (one pixel per LED channel) for downstream DMX routing."

[operator.FixtureUnpackCHOP]
family="CHOP"
script="res://addons/gn_ext_pixel_mapper/operators/chop/fixture_unpack_chop.gd"
description="Unpacks the packed result texture from FixtureSamplerTOP into named CHOP channels - one channel per fixture LED colour component. Wire to DmxOutCHOP."
