[library]
name = gn_depth_azure_kinect
entry_symbol = gn_depth_azure_kinect_init
platforms = windows, linux
tier = optional
optional = true
default = false

[sources]
cpp = src/*.cpp
include_dirs = src, ../shared

[windows]
include_dirs_azure = ../azure_kinect_sdk/include
lib_dirs_azure = ../azure_kinect_sdk/lib
libs_azure = k4a, k4abt
defines_azure = GN_DEPTH_HAS_AZURE_KINECT

[linux]
libs_azure = k4a, k4abt
defines_azure = GN_DEPTH_HAS_AZURE_KINECT
