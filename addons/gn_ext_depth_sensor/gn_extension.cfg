[extension]
name="Depth Sensors (Azure Kinect, RealSense, Ultraleap)"
version="1.0.0"
author="GONODES"
description="Unified depth sensor interface supporting Azure Kinect, Intel RealSense, and Ultraleap. Provides depth/color/IR textures, hardware skeleton tracking, hand and finger tracking, point clouds, and player segmentation with capability-based feature detection."
dependencies=["GNDepthSensor"]
section="Depth Sensor"
platforms=["windows", "linux"]

[operator.DepthSensorDAT]
family="DAT"
script="res://addons/gn_ext_depth_sensor/operators/dat/depth_sensor_dat.gd"
description="Lists all connected depth sensors with capabilities, serial numbers, and backend info."

[operator.DepthSensorIMG]
family="IMG"
script="res://addons/gn_ext_depth_sensor/operators/img/depth_sensor_img.gd"
description="Multi-output depth sensor: image + skeleton + hands + point cloud."
