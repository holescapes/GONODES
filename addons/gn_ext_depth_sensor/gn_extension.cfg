[extension]
name="Depth Sensors (Azure Kinect, RealSense, Ultraleap)"
version="1.0.0"
author="GONODES"
description="Unified depth sensor interface supporting Azure Kinect, Intel RealSense, and Ultraleap. Provides depth/color/IR textures, hardware skeleton tracking, hand and finger tracking, point clouds, and player segmentation with capability-based feature detection."
dependencies=["GNDepthSensor"]
section="Depth Sensor"
platforms=["windows", "linux"]

[operator.DepthSensorTOP]
family="TOP"
script="res://addons/gn_ext_depth_sensor/operators/top/depth_sensor_top.gd"
description="Depth sensor image streams: depth, color, IR, or player index texture."

[operator.DepthSkeletonCHOP]
family="CHOP"
script="res://addons/gn_ext_depth_sensor/operators/chop/depth_skeleton_chop.gd"
description="Hardware skeleton tracking from depth sensor (joint positions, rotations, confidence)."

[operator.DepthPointCloudSOP]
family="SOP"
script="res://addons/gn_ext_depth_sensor/operators/sop/depth_point_cloud_sop.gd"
description="Dense 3D point cloud mesh from depth sensor with per-point color."

[operator.DepthSensorDAT]
family="DAT"
script="res://addons/gn_ext_depth_sensor/operators/dat/depth_sensor_dat.gd"
description="Lists all connected depth sensors with capabilities, serial numbers, and backend info."

[operator.DepthHandCHOP]
family="CHOP"
script="res://addons/gn_ext_depth_sensor/operators/chop/depth_hand_chop.gd"
description="Hand and finger tracking from depth sensor (per-finger bone positions, rotations, grab/pinch strength)."
