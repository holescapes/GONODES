# build.cfg — Cross-platform video capture (MF / AVFoundation / V4L2)
# Declarative build configuration read by build/gn_build.py

[library]
name = gn_video_capture
entry_symbol = gn_video_capture_init
platforms = windows, macos, linux

[sources]
cpp = src/*.cpp

[windows]
libs = mfplat, mf, mfreadwrite, mfuuid, ole32, user32

[macos]
frameworks = AVFoundation, CoreMedia, CoreVideo, Foundation
objcxx_sources = src/*.mm

[linux]
libs =
