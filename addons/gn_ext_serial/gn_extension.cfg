[extension]

name="Serial Port"
version="1.0.0"
author="GONODES"
description="Serial port (COM / tty) communication extension. Provides SerialSendDAT and SerialReceiveDAT for bidirectional serial I/O. Uses the native GNNativeSerialPort C++ class from gn_ext_native for cross-platform hardware access (Windows COM, Linux/macOS tty). Falls back to scaffold mode without the native extension."
dependencies=["GNNativeSerialPort"]
section="Serial"

[operator.SerialSendDAT]

family="DAT"
script="res://addons/gn_ext_serial/operators/dat/serial_send_dat.gd"
description="Sends text or binary data out a serial port. Accepts a DAT input (rows are sent as messages). Uses native C++ serial I/O via GNNativeSerialPort."

[operator.SerialReceiveDAT]

family="DAT"
script="res://addons/gn_ext_serial/operators/dat/serial_receive_dat.gd"
description="Receives data from a serial port into a rolling DAT table. Supports newline, null, or raw (no delimiter) framing modes. Uses native C++ serial I/O via GNNativeSerialPort."
