[extension]

name="Serial Port"
version="1.0.0"
author="GONODES"
description="Serial port (COM / tty) communication extension. Provides SerialSendDAT and SerialReceiveDAT for bidirectional serial I/O. Requires a GDExtension or native plugin that exposes serial port access (e.g. GDSerialPort). Without the native backend, the operators run in scaffold mode — structuring data flow correctly but not performing actual hardware I/O."
dependencies=[]
section="Serial"

[operator.SerialSendDAT]

family="DAT"
script="res://addons/gn_ext_serial/operators/dat/serial_send_dat.gd"
description="Sends text or binary data out a serial port. Accepts a DAT input (rows are sent as messages) or a CHOP input (channel values formatted as CSV). Requires a serial GDExtension for actual hardware I/O."

[operator.SerialReceiveDAT]

family="DAT"
script="res://addons/gn_ext_serial/operators/dat/serial_receive_dat.gd"
description="Receives data from a serial port into a rolling DAT table. Supports newline, null, or raw (no delimiter) framing modes. Requires a serial GDExtension for actual hardware I/O."
