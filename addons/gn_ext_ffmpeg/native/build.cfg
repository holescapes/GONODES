# FFmpegInTOP is GDScript. It appears when EIRTeam.FFmpeg is installed at
# addons/EIRTeam.FFmpeg/. Nothing in this folder is compiled. The LGPL
# shared libraries are not fetched: there is no binary source this repo
# is willing to download. See the extension README and
# scripts/show_manual_sdks.py.

[library]
name = gn_ffmpeg
entry_symbol = gn_ffmpeg_init
platforms = windows, linux, macos
tier = extension
download_only = true
