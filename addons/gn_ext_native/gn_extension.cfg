[extension]

name="Native Acceleration"
version="1.0.0"
author="GONODES"
description="C++ accelerated operators for CPU-heavy algorithms. Each operator checks for C++ at init and falls back to GDScript if unavailable."
section="Native"

[operator.BlurIMGNative]

family="IMG"
script="res://addons/gn_ext_native/operators/img/blur_img_native.gd"
description="Box blur with native C++ acceleration."

[operator.NoiseIMGNative]

family="IMG"
script="res://addons/gn_ext_native/operators/img/noise_img_native.gd"
description="Procedural noise generator with native C++ acceleration."

[operator.PixelSortIMGNative]

family="IMG"
script="res://addons/gn_ext_native/operators/img/pixel_sort_img_native.gd"
description="Pixel-sorting glitch effect with native C++ acceleration."

[operator.ParticleSOPNative]

family="SOP"
script="res://addons/gn_ext_native/operators/sop/particle_sop_native.gd"
description="CPU particle system with native C++ acceleration."

[operator.MetaballSOPNative]

family="SOP"
script="res://addons/gn_ext_native/operators/sop/metaball_sop_native.gd"
description="Metaball iso-surface via marching cubes with native C++ acceleration."

[operator.PolyReduceSOPNative]

family="SOP"
script="res://addons/gn_ext_native/operators/sop/polyreduce_sop_native.gd"
description="QEM mesh decimation with native C++ acceleration."

[operator.IsoSurfaceSOPNative]

family="SOP"
script="res://addons/gn_ext_native/operators/sop/isosurface_sop_native.gd"
description="Implicit iso-surface generator (Gyroid, Schwarz-P/D, etc.) via marching cubes with native C++ acceleration."

[operator.RaySOPNative]

family="SOP"
script="res://addons/gn_ext_native/operators/sop/ray_sop_native.gd"
description="Ray-cast projection of source vertices onto target geometry with native C++ acceleration."

[operator.FacetSOPNative]

family="SOP"
script="res://addons/gn_ext_native/operators/sop/facet_sop_native.gd"
description="Facet unique / consolidate points with native C++ acceleration."

[operator.FuseSOPNative]

family="SOP"
script="res://addons/gn_ext_native/operators/sop/fuse_sop_native.gd"
description="Merge coincident points within threshold with native C++ acceleration."

[operator.SubdivideSOPNative]

family="SOP"
script="res://addons/gn_ext_native/operators/sop/subdivide_sop_native.gd"
description="Uniform triangle subdivision with native C++ acceleration."

[operator.CopySOPNative]

family="SOP"
script="res://addons/gn_ext_native/operators/sop/copy_sop_native.gd"
description="Copy-to-points instancing with native C++ acceleration."

[operator.LSystemSOPNative]

family="SOP"
script="res://addons/gn_ext_native/operators/sop/lsystem_sop_native.gd"
description="L-System fractal/branching geometry with native C++ acceleration."

[operator.SpringSOPNative]

family="SOP"
script="res://addons/gn_ext_native/operators/sop/spring_sop_native.gd"
description="Damped spring vertex deformer with native C++ acceleration."

[operator.EdgeDetectIMGNative]

family="IMG"
script="res://addons/gn_ext_native/operators/img/edge_detect_img_native.gd"
description="CPU edge detection (Sobel/Prewitt) with native C++ acceleration."

[operator.SmoothCHOPNative]

family="CHOP"
script="res://addons/gn_ext_native/operators/chop/smooth_chop_native.gd"
description="Biquad Butterworth filter (LP/HP/BP) with native C++ acceleration."
