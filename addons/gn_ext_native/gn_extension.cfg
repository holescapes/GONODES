[extension]

name="Native Acceleration"
version="1.0.0"
author="GONODES"
description="C++ accelerated operators for CPU-heavy algorithms. Each operator checks for C++ at init and falls back to GDScript if unavailable."
section="Native"

[operator.BlurIMGNative]

family="IMG"
script="res://addons/gn_ext_native/operators/img/blur_img_native.gd"
description="Box blur with native C++ acceleration."

[operator.NoiseIMGNative]

family="IMG"
script="res://addons/gn_ext_native/operators/img/noise_img_native.gd"
description="Procedural noise generator with native C++ acceleration."

[operator.PixelSortIMGNative]

