script="res://addons/gn_ext_native/operators/img/pixel_sort_img_native.gd"
description="Pixel-sorting glitch effect with native C++ acceleration."

[operator.ParticleSOPNative]

family="SOP"
script="res://addons/gn_ext_native/operators/sop/particle_sop_native.gd"
description="CPU particle system with native C++ acceleration."

[operator.MetaballSOPNative]

family="SOP"
script="res://addons/gn_ext_native/operators/sop/metaball_sop_native.gd"
