[extension]
name="Blackmagic Video I/O"
version="1.0.0"
author="GONODES"
description="Professional SDI/HDMI video capture and output via Blackmagic DeckLink SDK. Requires DeckLink hardware and drivers."
dependencies=["GNBlackmagic"]
section="Blackmagic"
platforms=["windows", "linux"]

[operator.BlackmagicDAT]
family="DAT"
script="res://addons/gn_ext_blackmagic/operators/dat/blackmagic_dat.gd"
description="Enumerate Blackmagic devices and query device info as a table."

[operator.BlackmagicInIMG]
family="IMG"
script="res://addons/gn_ext_blackmagic/operators/img/blackmagic_in_img.gd"
description="DeckLink video capture: RGBA image + signal status channels."

[operator.BlackmagicOutIMG]
family="IMG"
script="res://addons/gn_ext_blackmagic/operators/img/blackmagic_out_img.gd"
description="DeckLink video output: sends IMG to a DeckLink device."
