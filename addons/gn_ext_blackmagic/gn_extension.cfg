[extension]
name="Blackmagic Video I/O"
version="1.0.0"
author="GONODES"
description="Professional SDI/HDMI video capture and output via Blackmagic DeckLink SDK. Requires DeckLink hardware and drivers."
dependencies=["GNBlackmagic"]
section="Blackmagic"
platforms=["windows", "linux"]

[operator.BlackmagicInTOP]
family="TOP"
script="res://addons/gn_ext_blackmagic/operators/top/blackmagic_in_top.gd"
description="Capture SDI/HDMI video input from a Blackmagic DeckLink device."

[operator.BlackmagicOutTOP]
family="TOP"
script="res://addons/gn_ext_blackmagic/operators/top/blackmagic_out_top.gd"
description="Output video to SDI/HDMI via a Blackmagic DeckLink device."

[operator.BlackmagicDAT]
family="DAT"
script="res://addons/gn_ext_blackmagic/operators/dat/blackmagic_dat.gd"
description="Enumerate Blackmagic devices and query device info as a table."
