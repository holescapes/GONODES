[library]
name = gn_blackmagic
entry_symbol = gn_blackmagic_init
platforms = windows, linux
tier = optional
optional = true
default = false

[sources]
cpp = src/*.cpp
c = decklink_sdk/include/DeckLinkAPI_i.c
include_dirs = src, decklink_sdk/include

[windows]
probe = decklink_sdk/include/DeckLinkAPI.h
libs = ole32, oleaut32
defines = GN_BLACKMAGIC_HAS_DECKLINK

[linux]
probe = decklink_sdk/include/DeckLinkAPI.h
libs =
defines = GN_BLACKMAGIC_HAS_DECKLINK
