[extension]

name="User Python Operators"
version="1.0.0"
author="GONODES"
description="Embedded CPython operators with NumPy zero-copy data bridge. Write Python scripts with full ecosystem access (NumPy, SciPy, OpenCV, librosa) that cook at vectorised C speed. TD-style setup()/cook() lifecycle."
section="User Python"
platforms=["windows", "macos", "linux"]
dependencies=["GNPythonRuntime"]

[operator.UserPythonSOP]

family="SOP"
script="res://addons/gn_ext_user_python/operators/sop/user_python_sop.gd"
description="User-written Python SOP operator with NumPy."

[operator.UserPythonCHOP]

family="CHOP"
script="res://addons/gn_ext_user_python/operators/chop/user_python_chop.gd"
description="User-written Python CHOP operator with NumPy."

[operator.UserPythonIMG]

family="IMG"
script="res://addons/gn_ext_user_python/operators/img/user_python_img.gd"
description="User-written Python IMG operator with NumPy."

[operator.UserPythonTOP]

family="TOP"
script="res://addons/gn_ext_user_python/operators/top/user_python_top.gd"
description="User-written Python TOP operator with NumPy."

[operator.UserPythonDAT]

family="DAT"
script="res://addons/gn_ext_user_python/operators/dat/user_python_dat.gd"
description="User-written Python DAT operator with NumPy."
