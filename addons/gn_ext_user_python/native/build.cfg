# build.cfg — Embedded CPython runtime for User Python operators
# Declarative build configuration read by build/gn_build.py
#
# IMPORTANT: This extension links against CPython and numpy C API.
# You must have Python 3.10+ development headers installed.
#
# On Windows:  set PYTHON_HOME=C:\Python312  (or use the bundled embeddable)
# On Linux:    sudo apt install python3-dev python3-numpy
# On macOS:    brew install python3 numpy  (or use Python.framework)

[library]
name = gn_python
entry_symbol = gn_python_library_init
platforms = windows, linux, macos

[sources]
cpp = src/*.cpp
include_dirs = src

# Python paths are discovered at build time by python_config.py
# or by the [python] section overrides below.

[python]
# Minimum required Python version
min_version = 3.10
# If set, use this specific Python installation instead of auto-detect
# python_home =

[windows]
# python3xx.lib is discovered from PYTHON_HOME or py -c "import sysconfig"
libs = python312
defines = GN_PYTHON_ENABLED

[linux]
# pkg-config --libs python3-embed
libs = python3.12
defines = GN_PYTHON_ENABLED

[macos]
frameworks = Python
defines = GN_PYTHON_ENABLED
