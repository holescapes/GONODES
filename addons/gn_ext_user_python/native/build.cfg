# build.cfg — Embedded CPython runtime for User Python operators
# Declarative build configuration read by build/gn_build.py
#
# IMPORTANT: This extension links against CPython and numpy C API.
# You must have Python 3.10+ development headers installed.
#
# On Windows:  set PYTHON_HOME=C:\Python312  (or use the bundled embeddable)
# On Linux:    sudo apt install python3-dev python3-numpy
# On macOS:    brew install python3 numpy  (or use Python.framework)

[library]
name = gn_python
entry_symbol = gn_python_library_init
platforms = windows, linux, macos
vendor_setup = setup_python.py --no-enable
# The built .dll/.so must live outside native/ (which has .gdignore) so Godot
# can resolve it via res:// paths. library_dest copies it to extension_root/bin/<platform>/
library_dest = ../bin

[sources]
cpp = src/*.cpp
include_dirs = src

# Python paths are discovered at build time by python_config.py
# or by the [python] section overrides below.

[python]
# Minimum required Python version
min_version = 3.10
# If set, use this specific Python installation instead of auto-detect
# python_home =

[windows]
# python3xx.lib is discovered at build time by python_config.py
defines = GN_PYTHON_ENABLED
# Runtime DLLs: must live outside native/ (which has .gdignore) so Godot can
# resolve them via res:// for [dependencies] pre-loading.
# libgn_python.dll was compiled against Python 3.10; python310.dll is the direct import.
# python3.dll is the version-neutral stub (forwards to python310.dll for the 3.10 build).
# vcruntime140.dll, vcruntime140_1.dll — MSVC C++ runtime (shipped with Python embeddable)
# libffi-8.dll — required for ctypes support
# Paths are relative to native_dir; runtime_dlls_dest is relative to extension root.
runtime_dlls = bin/win64/python310.dll, bin/win64/python3.dll, bin/win64/vcruntime140.dll, bin/win64/vcruntime140_1.dll, bin/win64/libffi-8.dll
runtime_dlls_dest = bin/win64

[linux]
# libpython3.x is discovered at build time by python_config.py
defines = GN_PYTHON_ENABLED

[macos]
frameworks = Python
defines = GN_PYTHON_ENABLED
