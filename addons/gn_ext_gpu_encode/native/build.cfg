# build.cfg — GPU video encoding (Media Foundation / VideoToolbox)
# Declarative build configuration read by build/gn_build.py

[library]
name = gn_gpu_encode
entry_symbol = gn_gpu_encode_init
platforms = windows, macos
tier = core
default = true

[sources]
cpp = src/*.cpp

[windows]
libs = mfplat, mf, mfreadwrite, mfuuid, ole32, propsys

[macos]
frameworks = VideoToolbox, CoreMedia, CoreVideo, CoreFoundation, AVFoundation
objcxx_sources = src/*.mm
