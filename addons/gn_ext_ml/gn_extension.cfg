[extension]
name="Machine Learning (ONNX Runtime)"
version="1.0.0"
author="GONODES"
description="ML inference bridge via ONNX Runtime. Body pose, hand tracking, face mesh, depth estimation, style transfer, segmentation, and object detection from pre-trained models."
dependencies=["GNOnnxInference"]
section="ML"
platforms=["windows", "linux", "macos"]

[operator.PoseDetectCHOP]
family="CHOP"
script="res://addons/gn_ext_ml/operators/chop/pose_detect_chop.gd"
description="Body pose estimation via BlazePose. IMG input, 33 keypoints as CHOP channels (x/y/z/visibility per joint)."

[operator.HandDetectCHOP]
family="CHOP"
script="res://addons/gn_ext_ml/operators/chop/hand_detect_chop.gd"
description="Hand landmark tracking. IMG input, 21 landmarks per hand as CHOP channels."

[operator.FaceDetectCHOP]
family="CHOP"
script="res://addons/gn_ext_ml/operators/chop/face_detect_chop.gd"
description="Face mesh landmarks. IMG input, 468 points as CHOP channels for face tracking and expression."

[operator.DepthEstimateIMG]
family="IMG"
script="res://addons/gn_ext_ml/operators/img/depth_estimate_img.gd"
description="Monocular depth estimation via MiDaS - outputs a depth map image from any camera or image."

[operator.StyleTransferIMG]
family="IMG"
script="res://addons/gn_ext_ml/operators/img/style_transfer_img.gd"
description="Fast neural style. Style is Mosaic, Candy, Udnie, Rain Princess, Pointillism, or a custom ONNX file."

[operator.SegmentationIMG]
family="IMG"
script="res://addons/gn_ext_ml/operators/img/segmentation_img.gd"
description="Person/background segmentation - outputs a binary mask image for compositing."

[operator.ObjectDetectDAT]
family="DAT"
script="res://addons/gn_ext_ml/operators/dat/object_detect_dat.gd"
description="Object detection from a YOLO ONNX file you supply. Ultralytics YOLOv8 weights are AGPL-3.0 and are not downloaded. Output is a table of labels and boxes."
