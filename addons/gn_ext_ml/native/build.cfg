[library]
name = gn_ml
entry_symbol = gn_ml_init
platforms = windows, linux, macos
tier = core
default = true
setup = setup_ml.py --sdk-only --no-enable

[sources]
cpp = src/*.cpp
include_dirs = src, onnxruntime/include

[windows]
lib_dirs = onnxruntime/lib/x86_64-windows
libs = onnxruntime

[linux]
lib_dirs = onnxruntime/lib/x86_64-linux
libs = onnxruntime

[macos]
lib_dirs = onnxruntime/lib
libs = onnxruntime
