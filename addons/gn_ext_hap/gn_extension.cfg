[extension]
name="HAP Video Codec"
version="1.0.0"
author="GONODES"
description="HAP GPU-direct video codec for VJ workflows. Stores S3TC/DXT compressed frames that upload directly to the GPU with zero CPU decode overhead. Supports HAP, HAP Alpha, and HAP Q variants. Requires the GNHapCodec GDExtension."
dependencies=["GNHapDecoder"]
section="Video"

[operator.HapInTOP]
family="TOP"
script="res://addons/gn_ext_hap/operators/top/hap_in_top.gd"
description="GPU-direct HAP video playback - DXT frames upload directly to GPU without CPU decode."

[operator.HapOUT]
family="OUT"
script="res://addons/gn_ext_hap/operators/output/hap_out.gd"
description="Encode input texture to HAP .mov. Duration auto-stop + Progress/Status."
