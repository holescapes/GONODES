# build.cfg — HAP GPU-direct video codec
# Declarative build configuration read by build/gn_build.py

[library]
name = gn_hap_codec
entry_symbol = gn_hap_codec_init
platforms = windows, macos, linux

[sources]
cpp = src/*.cpp
thirdparty_c = hap/*.c
thirdparty_cc = snappy/*.cc
thirdparty_cpp = squish/*.cpp
include_dirs = hap, snappy, squish
