[extension]
name="OpenCV Computer Vision"
version="1.0.0"
author="GONODES"
description="20 computer-vision operators powered by OpenCV 4.x. Threshold, morphology, blob tracking, contour detection, optical flow, color tracking, object tracking, Hough lines/circles, convolution, camera calibration, undistortion, perspective warp, ArUco/QR detection, feature matching, stereo depth, and overlay drawing. All IMG family (CPU). Requires the GNOpenCV GDExtension."
dependencies=["GNOpenCV"]
section="OpenCV"
platforms=["windows", "macos", "linux"]


[operator.ThresholdIMG]
family="IMG"
script="res://addons/gn_ext_opencv/operators/img/threshold_img.gd"
description="Binary, Otsu, adaptive Gaussian/mean thresholding for image segmentation."

[operator.MorphIMG]
family="IMG"
script="res://addons/gn_ext_opencv/operators/img/morph_img.gd"
description="Morphological operations - erode, dilate, open, close, gradient, top-hat, black-hat."

[operator.BlobTrackIMG]
family="IMG"
script="res://addons/gn_ext_opencv/operators/img/blob_track_img.gd"
description="Blob detection with persistent ID tracking. Port 0: overlay image, Port 1: CHOP tracking channels (id, cx, cy, area, width, height per blob)."

[operator.BackgroundSubtractIMG]
family="IMG"
script="res://addons/gn_ext_opencv/operators/img/bg_subtract_img.gd"
description="Adaptive background subtraction (MOG2 / KNN). Outputs foreground mask."

[operator.ContourIMG]
family="IMG"
script="res://addons/gn_ext_opencv/operators/img/contour_img.gd"
description="Find and draw contours. Port 0: overlay image, Port 1: DAT contour table (index, area, cx, cy, perimeter, vertices)."


[operator.OpticalFlowIMG]
family="IMG"
script="res://addons/gn_ext_opencv/operators/img/optical_flow_img.gd"
description="Dense Farneback optical flow - outputs an RG motion field image."

[operator.ColorTrackIMG]
family="IMG"
script="res://addons/gn_ext_opencv/operators/img/color_track_img.gd"
description="Track a color range in HSV space. Port 0: binary mask, Port 1: CHOP tracking channels (cx, cy, area, pixel_count)."

[operator.ObjectTrackIMG]
family="IMG"
script="res://addons/gn_ext_opencv/operators/img/object_track_img.gd"
description="Single-object visual tracker (KCF / CSRT / MOSSE). Port 0: overlay image, Port 1: CHOP tracked ROI (cx, cy, w, h, confidence)."


[operator.HoughLinesIMG]
family="IMG"
script="res://addons/gn_ext_opencv/operators/img/hough_lines_img.gd"
description="Probabilistic Hough line detection. Port 0: overlay image, Port 1: DAT line table (x1, y1, x2, y2, length, angle)."

[operator.HoughCirclesIMG]
family="IMG"
script="res://addons/gn_ext_opencv/operators/img/hough_circles_img.gd"
description="Hough circle detection. Port 0: overlay image, Port 1: DAT circle table (cx, cy, radius)."

[operator.ConvolveIMG]
family="IMG"
script="res://addons/gn_ext_opencv/operators/img/convolve_img.gd"
description="Arbitrary NxN kernel convolution - custom edge detectors, emboss, sharpen."


[operator.CameraCalibDAT]
family="DAT"
script="res://addons/gn_ext_opencv/operators/dat/camera_calib_dat.gd"
description="Camera intrinsics calibration from chessboard / circle-grid frames."

[operator.CameraUndistortIMG]
family="IMG"
script="res://addons/gn_ext_opencv/operators/img/camera_undistort_img.gd"
description="Lens undistortion using calibration data (camera matrix + distortion coefficients)."

[operator.PerspectiveWarpIMG]
family="IMG"
script="res://addons/gn_ext_opencv/operators/img/perspective_warp_img.gd"
description="4-point homography warp - keystoning, surface mapping, document scanning."


[operator.ArucoDetectIMG]
family="IMG"
script="res://addons/gn_ext_opencv/operators/img/aruco_detect_img.gd"
description="ArUco / AprilTag detection. Port 0: overlay image, Port 1: DAT marker table (id, cx, cy, corners)."

[operator.ArucoPoseDAT]
family="DAT"
script="res://addons/gn_ext_opencv/operators/dat/aruco_pose_dat.gd"
description="3D pose estimation from detected ArUco markers + camera calibration."

[operator.QRCodeDAT]
family="DAT"
script="res://addons/gn_ext_opencv/operators/dat/qrcode_dat.gd"
description="QR / barcode detection and decoding. Outputs decoded text and bounding corners."

[operator.FeatureMatchIMG]
family="IMG"
script="res://addons/gn_ext_opencv/operators/img/feature_match_img.gd"
description="Keypoint detection + descriptor matching (ORB / SIFT / AKAZE) between two images."


[operator.StereoDepthIMG]
family="IMG"
script="res://addons/gn_ext_opencv/operators/img/stereo_depth_img.gd"
description="Stereo depth map from a left/right image pair (no special hardware needed)."

[operator.DrawOverlayIMG]
family="IMG"
script="res://addons/gn_ext_opencv/operators/img/draw_overlay_img.gd"
description="Utility - draw bounding boxes, circles, text labels, polylines, crosshairs on an image."
