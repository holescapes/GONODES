# build.cfg — OpenCV computer vision bridge
# Declarative build configuration read by build/gn_build.py

[library]
name = gn_opencv
entry_symbol = gn_opencv_init
platforms = windows, linux, macos
tier = optional
optional = true
default = false
setup = setup_opencv.py --no-enable

[sources]
cpp = src/*.cpp
include_dirs = src, opencv_sdk/opencv/build/include

[windows]
probe = opencv_sdk/opencv/build/x64/vc16/lib/opencv_world4100.lib
lib_dirs = opencv_sdk/opencv/build/x64/vc16/lib
libs = opencv_world4100
runtime_dlls = opencv_sdk/opencv/build/x64/vc16/bin/opencv_world4100.dll

[linux]
libs = opencv_core, opencv_imgproc, opencv_calib3d, opencv_video, opencv_features2d, opencv_objdetect, opencv_photo

[macos]
libs = opencv_core, opencv_imgproc, opencv_calib3d, opencv_video, opencv_features2d, opencv_objdetect, opencv_photo
