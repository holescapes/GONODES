; ═══════════════════════════════════════════════════════════════════════════════
; GONODES Export Presets
; ═══════════════════════════════════════════════════════════════════════════════
;
; Presets 0:       Editor (Windows x86_64) — the original/manual export preset
; Presets 1-5:     Player builds for each desktop target
;                  (used by scripts/build_templates.ps1 and build_templates.sh)
; Presets 6-9:     Editor builds for each desktop target (optional)
;
; The build script temporarily swaps project.godot's run/main_scene to
; player_main.tscn before exporting Player presets, then restores it.
;
; Godot version: 4.6.1 stable — update export templates when upgrading.
;
; Release-build optimizations baked into every preset:
;   • script_export_mode=2          Compiled binary tokens (fastest parse)
;   • shader_baker/enabled=true     Pre-bake shaders → no first-frame stutter
;   • embed_pck=false               Separate .pck is platform-agnostic
;   • s3tc_bptc=true                Desktop GPU texture compression
;   • export_d3d12=1 (Windows)      Bundle D3D12 Agility SDK for self-contained runtime
;   • export_angle=0                No ANGLE — not needed for desktop targets
;   • export via --export-release   Uses release export templates (optimized, stripped)
; ═══════════════════════════════════════════════════════════════════════════════

