; ───────────────────────────────────────────────────────────────────────────────
; Mobile & Web Player Presets (Phase 4 — mobile/web export)
; ───────────────────────────────────────────────────────────────────────────────
;
; Preset 10: Player Android (ARM64)   — Compatibility renderer (no compute)
; Preset 11: Player iOS (ARM64)       — Mobile renderer (Vulkan-lite/Metal)
; Preset 12: Player Web (WASM)        — Compatibility renderer (WebGL2)
;
; Notes:
;   • Android uses Compatibility renderer for maximum device coverage.
;     Switch to Mobile renderer for devices with Vulkan support.
;   • iOS uses Mobile renderer (Metal backend).
;   • Web uses Compatibility renderer (WebGL2).
;     COOP/COEP headers required for SharedArrayBuffer (threading).
;   • GDExtensions (gn_ext_native, etc.) require platform-specific binaries.
;     See dev_docs/BUILD.md for WASM cross-compilation guidance.
;   • embed_pck=true for mobile/web (single-file distribution).
;   • etc2_astc=true for mobile texture compression.
;   • shader_baker/enabled=true for all presets (no first-frame stutter).
; ───────────────────────────────────────────────────────────────────────────────

