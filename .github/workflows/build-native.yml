name: Build gn_native (Linux & macOS)

on:
  push:
    paths:
      - 'addons/gn_native/src/**'
      - 'addons/gn_native/SConstruct'
      - '.github/workflows/build-native.yml'
  pull_request:
    paths:
      - 'addons/gn_native/src/**'
      - 'addons/gn_native/SConstruct'
  workflow_dispatch: # manual trigger

env:
  SCONS_FLAGS: "target=template_release -j4"

jobs:
  # ── Linux x86_64 ──────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 python3-pip g++ pkg-config
          pip3 install scons

      - name: Build gn_native (Linux x86_64)
        run: |
          cd addons/gn_native
          scons platform=linux $SCONS_FLAGS

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: gn-native-linux-x86_64
          path: addons/gn_native/bin/linux64/
          retention-days: 90

  # ── macOS (universal: x86_64 + arm64) ─────────────────────────────────────
  build-macos:
    runs-on: macos-14  # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install SCons
        run: pip3 install scons

      - name: Build gn_native (macOS arm64)
        run: |
          cd addons/gn_native
          scons platform=macos arch=arm64 $SCONS_FLAGS

      - name: Build gn_native (macOS x86_64)
        run: |
          cd addons/gn_native
          scons platform=macos arch=x86_64 $SCONS_FLAGS

      - name: Create universal binary
        run: |
          cd addons/gn_native/bin/macos
          # Find the arm64 and x86_64 dylibs and lipo them together
          ARM_LIB=$(find . -name "*arm64*" -type f | head -1)
          X86_LIB=$(find . -name "*x86_64*" -type f | head -1)
          if [ -n "$ARM_LIB" ] && [ -n "$X86_LIB" ]; then
            UNIVERSAL_NAME=$(echo "$ARM_LIB" | sed 's/\.arm64//')
            lipo -create "$ARM_LIB" "$X86_LIB" -output "$UNIVERSAL_NAME"
            echo "Created universal binary: $UNIVERSAL_NAME"
          else
            echo "Skipping lipo — single-arch build only"
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: gn-native-macos
          path: addons/gn_native/bin/macos/
          retention-days: 90

  # ── Windows x86_64 (for completeness) ─────────────────────────────────────
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install SCons
        run: pip install scons

      - name: Build gn_native (Windows x86_64)
        run: |
          cd addons/gn_native
          scons platform=windows $env:SCONS_FLAGS

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: gn-native-windows-x86_64
          path: addons/gn_native/bin/win64/
          retention-days: 90
